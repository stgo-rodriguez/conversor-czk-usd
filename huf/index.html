<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><title>Conversor HUF</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--result:#102a43}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}main{width:min(100%,540px);margin:auto;padding:12px 14px 28px}h1{font-size:1.25rem;margin:2px 0}.sub{font-size:.82rem;color:var(--muted);margin:0 0 10px}.card{background:var(--card);border-radius:16px;padding:13px;box-shadow:0 6px 20px #00000012;margin-bottom:10px}label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px}input,button{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit}#amount{font-size:1.7rem;font-weight:750}.results{display:grid;gap:8px;margin-top:9px}.result{padding:11px 12px;border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb}.currency{font-size:.78rem;color:var(--muted);font-weight:700}.value{font-size:1.65rem;font-weight:800;color:var(--result);line-height:1.15;margin-top:2px}.refresh{margin-top:9px;background:#1f3a56;color:#fff;border:0;font-weight:750}.status{font-size:.78rem;min-height:1.2em;margin-top:7px;color:#166534}.status.error{color:#991b1b}.rates{font-size:.75rem;color:var(--muted);line-height:1.45}footer{font-size:.7rem;color:var(--muted)}
</style></head>
<body><main><h1>Conversor HUF</h1><p class="sub">Florines húngaros → euros, dólares y pesos argentinos.</p>
<section class="card"><label for="amount">Importe en HUF</label><input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" autofocus>
<div class="results"><div class="result"><div class="currency">EUR · Euro</div><div class="value" id="eur">—</div></div><div class="result"><div class="currency">USD · Dólar estadounidense</div><div class="value" id="usd">—</div></div><div class="result"><div class="currency">ARS · Peso argentino</div><div class="value" id="ars">—</div></div></div></section>
<section class="card"><button class="refresh" id="refresh">Actualizar cotizaciones</button><div class="status" id="status"></div><div class="rates" id="ratesText"></div></section>
<footer>Las últimas cotizaciones se guardan en el dispositivo para seguir convirtiendo sin conexión.</footer></main>
<script>
const $=id=>document.getElementById(id),amount=$('amount'),eur=$('eur'),usd=$('usd'),ars=$('ars'),status=$('status'),refresh=$('refresh'),ratesText=$('ratesText');
const DEF={EUR:0.00276,USD:0.00315,ARS:4.45};let rates=JSON.parse(localStorage.getItem('hufRates')||'null')||DEF;let rateDate=localStorage.getItem('hufRatesDate')||'';
const fmt=(v,c)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:2}).format(v);
function parseNumber(v){let t=String(v).trim().replace(/\s/g,'').replace(/[^\d.,]/g,'');if(!t)return NaN;const d=(t.match(/\./g)||[]).length,c=(t.match(/,/g)||[]).length;if(d&&c){const dec=t.lastIndexOf('.')>t.lastIndexOf(',')?'.':',';t=t.replace(dec==='.'?/,/g:/\./g,'').replace(dec,'.')}else if(c===1){const p=t.split(',');t=p[1].length===3?t.replace(',',''):t.replace(',','.')}else if(d===1){const p=t.split('.');t=p[1].length===3?t.replace('.',''):t}else t=t.replace(/[.,]/g,'');return Number(t)}
function render(){ratesText.textContent=`1 HUF = ${rates.EUR.toFixed(6)} EUR · ${rates.USD.toFixed(6)} USD · ${rates.ARS.toFixed(4)} ARS${rateDate?' · '+rateDate:''}`}
function calc(){const n=parseNumber(amount.value);if(!amount.value.trim()||!Number.isFinite(n)){eur.textContent=usd.textContent=ars.textContent='—';return}eur.textContent=fmt(n*rates.EUR,'EUR');usd.textContent=fmt(n*rates.USD,'USD');ars.textContent=fmt(n*rates.ARS,'ARS')}
async function updateRates(){status.className='status';if(!navigator.onLine){status.textContent='Sin conexión. Se usan las últimas cotizaciones guardadas.';status.classList.add('error');return}refresh.disabled=true;refresh.textContent='Actualizando…';status.textContent='Consultando cotizaciones…';try{const r=await fetch('https://api.frankfurter.dev/v2/rates?base=HUF&quotes=EUR,USD,ARS',{cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json(),next={...rates};for(const row of data)if(['EUR','USD','ARS'].includes(row.quote))next[row.quote]=Number(row.rate);if(![next.EUR,next.USD,next.ARS].every(Number.isFinite))throw new Error();rates=next;rateDate=data[0]?.date||new Date().toISOString().slice(0,10);localStorage.setItem('hufRates',JSON.stringify(rates));localStorage.setItem('hufRatesDate',rateDate);render();calc();status.textContent=`Cotizaciones actualizadas (${rateDate}).`}catch(e){status.textContent='No se pudo actualizar. Se mantienen las últimas cotizaciones guardadas.';status.classList.add('error')}finally{refresh.disabled=false;refresh.textContent='Actualizar cotizaciones'}}
amount.addEventListener('input',calc);refresh.addEventListener('click',updateRates);window.addEventListener('load',()=>{amount.focus({preventScroll:true});render();calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')});
</script></body></html>
