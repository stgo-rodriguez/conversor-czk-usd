<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Conversor CZK ↔ USD</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#111827;--result:#102a43}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{width:min(100%,540px);margin:auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:1.25rem;margin:2px 0}.sub{color:var(--muted);font-size:.82rem;margin:0 0 8px}
.card{background:var(--card);border-radius:16px;padding:13px;box-shadow:0 6px 20px #00000012;margin-bottom:10px}
label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px}.money{display:grid;grid-template-columns:1fr 86px;gap:8px}
input,select,button{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;background:#fff;color:var(--text)}
#amount{font-size:1.65rem;font-weight:750;padding:16px}.result{margin-top:8px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb}
.big{font-size:1.85rem;font-weight:800;line-height:1.1;word-break:break-word;color:var(--result)}.small{font-size:.8rem;color:var(--muted);margin-top:4px}
.swap{margin-top:8px;background:var(--accent);color:#fff;border:0;font-weight:750}.rate{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.rate-actions{display:grid;grid-template-columns:auto auto;gap:7px}.save,.refresh{width:auto;color:#fff;border:0;font-weight:700}.save{background:#374151}.refresh{background:#1f3a56}
.refresh:disabled{opacity:.6}.status{font-size:.8rem;min-height:1.1em;margin-top:6px;color:#166534}.status.error{color:#991b1b}
footer{font-size:.72rem;color:var(--muted);padding:2px}@media(max-width:390px){.rate{grid-template-columns:1fr}.rate-actions{grid-template-columns:1fr 1fr}.save,.refresh{width:100%}}
</style>
</head>
<body>
<main>
<h1>Conversor CZK ↔ USD</h1>
<p class="sub">Conversión manual rápida y funcionamiento offline.</p>
<section class="card">
<label for="amount">Importe</label>
<div class="money">
<input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" autofocus>
<select id="from"><option value="CZK">CZK</option><option value="USD">USD</option></select>
</div>
<div class="result"><div class="big" id="result">—</div><div class="small" id="detail">Ingrese un monto.</div></div>
<button class="swap" id="swap">Cambiar sentido</button>
</section>
<section class="card">
<div class="rate">
<div><label for="rate">1 USD = cuántas CZK</label><input id="rate" type="number" inputmode="decimal" min="0.0001" step="0.0001" value="21.50"></div>
<div class="rate-actions"><button class="save" id="save">Guardar</button><button class="refresh" id="refreshRate">Actualizar</button></div>
</div>
<div class="status" id="status"></div>
</section>
<footer>La última cotización se guarda en el dispositivo y queda disponible sin conexión.</footer>
</main>
<script>
const $=id=>document.getElementById(id),amount=$('amount'),from=$('from'),rate=$('rate'),result=$('result'),detail=$('detail'),status=$('status'),refreshRate=$('refreshRate');
const savedRate=localStorage.getItem('czkUsdRate');if(savedRate)rate.value=savedRate;
const savedDate=localStorage.getItem('czkUsdRateDate');if(savedDate)status.textContent=`Cotización guardada del ${savedDate}.`;
const money=(v,c)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:2}).format(v);
function parseNumber(value){
 let text=String(value).trim().replace(/\s/g,'').replace(/[^\d.,]/g,'');if(!text)return NaN;
 const dots=(text.match(/\./g)||[]).length,commas=(text.match(/,/g)||[]).length;
 if(dots&&commas){const decimal=text.lastIndexOf('.')>text.lastIndexOf(',')?'.':',';text=text.replace(decimal==='.'?/,/g:/\./g,'').replace(decimal,'.')}
 else if(commas===1){const p=text.split(',');text=p[1].length===3?text.replace(',',''):text.replace(',','.')}
 else if(dots===1){const p=text.split('.');text=p[1].length===3?text.replace('.',''):text}else{text=text.replace(/[.,]/g,'')}
 return Number(text)
}
function calculate(){
 const value=parseNumber(amount.value),exchangeRate=Number(rate.value);
 if(!amount.value.trim()){result.textContent='—';detail.textContent='Ingrese un monto.';return}
 if(!Number.isFinite(value)||!Number.isFinite(exchangeRate)||exchangeRate<=0){result.textContent='—';detail.textContent='Revise los valores.';return}
 if(from.value==='CZK'){result.textContent=money(value/exchangeRate,'USD');detail.textContent=`${money(value,'CZK')} ÷ ${exchangeRate.toLocaleString('es-AR')} CZK/USD`}
 else{result.textContent=money(value*exchangeRate,'CZK');detail.textContent=`${money(value,'USD')} × ${exchangeRate.toLocaleString('es-AR')} CZK/USD`}
}
function saveRate(value,dateText){localStorage.setItem('czkUsdRate',String(value));if(dateText)localStorage.setItem('czkUsdRateDate',dateText)}
async function updateOnlineRate(){
 status.className='status';
 if(!navigator.onLine){status.textContent='Sin conexión. Se mantiene la última cotización guardada.';status.classList.add('error');return}
 refreshRate.disabled=true;refreshRate.textContent='Actualizando…';status.textContent='Consultando cotización…';
 try{
  const response=await fetch('https://api.frankfurter.dev/v2/rate/USD/CZK?providers=CNB',{cache:'no-store'});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const data=await response.json(),onlineRate=Number(data.rate);
  if(!Number.isFinite(onlineRate)||onlineRate<=0)throw new Error('Cotización inválida');
  const dateText=data.date||new Date().toISOString().slice(0,10);
  rate.value=onlineRate.toFixed(4);saveRate(onlineRate,dateText);calculate();
  status.textContent=`Cotización actualizada y guardada (${dateText}).`;
 }catch(error){console.error(error);status.textContent='No se pudo actualizar. Se mantiene la última cotización guardada.';status.classList.add('error')}
 finally{refreshRate.disabled=false;refreshRate.textContent='Actualizar'}
}
amount.addEventListener('input',calculate);from.addEventListener('change',calculate);rate.addEventListener('input',calculate);
$('swap').addEventListener('click',()=>{from.value=from.value==='CZK'?'USD':'CZK';calculate();amount.focus()});
$('save').addEventListener('click',()=>{const value=Number(rate.value);status.className='status';if(!Number.isFinite(value)||value<=0){status.textContent='Cotización inválida.';status.classList.add('error');return}
 const dateText=new Date().toISOString().slice(0,10);saveRate(value,dateText);status.textContent='Cotización guardada manualmente.';setTimeout(()=>status.textContent='',1800);amount.focus()
});
refreshRate.addEventListener('click',updateOnlineRate);
window.addEventListener('load',()=>{amount.focus({preventScroll:true});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')});
calculate();
</script>
</body>
</html>
