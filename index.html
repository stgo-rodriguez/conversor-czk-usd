<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CZK USD">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Conversor CZK ↔ USD</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#111827}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
    main{width:min(100%,540px);margin:auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
    h1{font-size:1.25rem;margin:2px 0}.sub{color:var(--muted);font-size:.82rem;margin:0 0 8px}
    .card{background:var(--card);border-radius:16px;padding:13px;box-shadow:0 6px 20px #00000012;margin-bottom:10px}
    label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px}
    .money{display:grid;grid-template-columns:1fr 86px;gap:8px}
    input,select,button{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;background:#fff;color:var(--text)}
    #amount{font-size:1.65rem;font-weight:750;padding:16px}
    .result{margin-top:8px;padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#f9fafb}
    .big{font-size:1.85rem;font-weight:800;line-height:1.1;word-break:break-word}.small{font-size:.8rem;color:var(--muted);margin-top:4px}
    .swap{margin-top:8px;background:var(--accent);color:#fff;border:0;font-weight:750}
    .rate{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.save{width:auto;background:#374151;color:#fff;border:0;font-weight:700}
    .status{font-size:.8rem;min-height:1.1em;margin-top:6px;color:#166534}
    footer{font-size:.72rem;color:var(--muted);padding:2px}
  </style>
</head>
<body>
<main>
  <h1>Conversor CZK ↔ USD</h1>
  <p class="sub">Conversión manual rápida y funcionamiento offline.</p>

  <section class="card">
    <label for="amount">Importe</label>
    <div class="money">
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" autofocus>
      <select id="from" aria-label="Moneda de origen">
        <option value="CZK">CZK</option>
        <option value="USD">USD</option>
      </select>
    </div>

    <div class="result" aria-live="polite">
      <div class="big" id="result">—</div>
      <div class="small" id="detail">Ingrese un monto.</div>
    </div>

    <button class="swap" id="swap" type="button">Cambiar sentido</button>
  </section>

  <section class="card">
    <div class="rate">
      <div>
        <label for="rate">1 USD = cuántas CZK</label>
        <input id="rate" type="number" inputmode="decimal" min="0.0001" step="0.0001" value="21.50">
      </div>
      <button class="save" id="save" type="button">Guardar</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <footer>La cotización se guarda en el dispositivo.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const amount = $('amount'), from = $('from'), rate = $('rate');
const result = $('result'), detail = $('detail'), status = $('status');

const savedRate = localStorage.getItem('czkUsdRate');
if (savedRate) rate.value = savedRate;

const money = (value, currency) => new Intl.NumberFormat('es-AR', {
  style:'currency', currency, maximumFractionDigits:2
}).format(value);

function parseNumber(value) {
  let text = String(value).trim().replace(/\s/g,'').replace(/[^\d.,]/g,'');
  if (!text) return NaN;
  const dots = (text.match(/\./g) || []).length;
  const commas = (text.match(/,/g) || []).length;

  if (dots && commas) {
    const decimal = text.lastIndexOf('.') > text.lastIndexOf(',') ? '.' : ',';
    text = text.replace(decimal === '.' ? /,/g : /\./g, '').replace(decimal, '.');
  } else if (commas === 1) {
    const parts = text.split(',');
    text = parts[1].length === 3 ? text.replace(',','') : text.replace(',','.');
  } else if (dots === 1) {
    const parts = text.split('.');
    text = parts[1].length === 3 ? text.replace('.','') : text;
  } else {
    text = text.replace(/[.,]/g,'');
  }
  return Number(text);
}

function calculate() {
  const value = parseNumber(amount.value);
  const exchangeRate = Number(rate.value);

  if (!amount.value.trim()) {
    result.textContent = '—';
    detail.textContent = 'Ingrese un monto.';
    return;
  }

  if (!Number.isFinite(value) || !Number.isFinite(exchangeRate) || exchangeRate <= 0) {
    result.textContent = '—';
    detail.textContent = 'Revise los valores.';
    return;
  }

  if (from.value === 'CZK') {
    result.textContent = money(value / exchangeRate, 'USD');
    detail.textContent = `${money(value,'CZK')} ÷ ${exchangeRate.toLocaleString('es-AR')} CZK/USD`;
  } else {
    result.textContent = money(value * exchangeRate, 'CZK');
    detail.textContent = `${money(value,'USD')} × ${exchangeRate.toLocaleString('es-AR')} CZK/USD`;
  }
}

amount.addEventListener('input', calculate);
from.addEventListener('change', calculate);
rate.addEventListener('input', calculate);

$('swap').addEventListener('click', () => {
  from.value = from.value === 'CZK' ? 'USD' : 'CZK';
  calculate();
  amount.focus();
});

$('save').addEventListener('click', () => {
  const value = Number(rate.value);
  if (!Number.isFinite(value) || value <= 0) {
    status.textContent = 'Cotización inválida.';
    return;
  }
  localStorage.setItem('czkUsdRate', String(value));
  status.textContent = 'Cotización guardada.';
  setTimeout(() => status.textContent = '', 1400);
  amount.focus();
});

window.addEventListener('load', () => {
  amount.focus({preventScroll:true});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
});

calculate();
</script>
</body>
</html>
